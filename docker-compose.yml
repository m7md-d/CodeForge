version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeforge_backend
    ports:
      - "8000:8000"
    volumes:
      # Data mapping natively translates DB interactions up a directory into this dedicated mount point
      - ./data:/app/data
    restart: unless-stopped
    networks:
      - codeforge_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codeforge_frontend
    ports:
      # Exposes Nginx (Port 80 internally) to 5173 on the host for classic Vite dev aesthetics
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - codeforge_network

networks:
  codeforge_network:
    driver: bridge
